name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Check, build and JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      # TODO: switch to plain `vp check` once `vp fmt` has been run on the whole repo.
      - run: vp check --no-fmt
      - run: vp build
      - run: vp run test:js

  # Runs PHPUnit directly on the runner (PHP + its preinstalled MySQL) instead of
  # through wp-env, which spends ~100 s starting Docker containers. Locally,
  # `vp run test:php` still uses wp-env.
  php:
    name: PHP tests
    runs-on: ubuntu-latest
    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DIR: ${{ github.workspace }}/vendor/wp-phpunit/wp-phpunit
      WP_PHPUNIT__TESTS_CONFIG: ${{ github.workspace }}/tests/wp-tests-config.php
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.3"
          extensions: mysqli
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Cache WordPress core
        uses: actions/cache@v6
        with:
          path: ${{ env.WP_CORE_DIR }}
          key: wordpress-core-${{ hashFiles('composer.lock') }}
      - run: bin/install-ci-wordpress.sh
      - name: Start MySQL and create the test database
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS wordpress_test"
      - name: Install WPGraphQL for integration tests
        run: |
          curl --fail --location https://downloads.wordpress.org/plugin/wp-graphql.latest-stable.zip -o /tmp/wpgraphql.zip
          unzip -q /tmp/wpgraphql.zip -d /tmp
      - name: Install WooCommerce for integration tests
        run: |
          curl --fail --location https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip -o /tmp/woocommerce.zip
          unzip -q /tmp/woocommerce.zip -d /tmp
      - run: vendor/bin/phpunit
        env:
          WPGRAPHQL_PLUGIN_FILE: /tmp/wp-graphql/wp-graphql.php
          WC_PLUGIN_FILE: /tmp/woocommerce/woocommerce.php
