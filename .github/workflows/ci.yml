name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Check, build and JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      # TODO: switch to plain `vp check` once `vp fmt` has been run on the whole repo.
      - run: vp check --no-fmt
      - run: vp build
      - run: vp run test:js

  php:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      - run: vp run start
      - run: vp run composer install
      - run: vp run test:php
